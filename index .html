<body>
<title>Le Temple des Quatre Sceaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one-screen adventure — top bar (seal count, chrono, hint, sound), a parallax temple scene, bottom bar (carnet, back, ranking). Objects zoom into a full-screen 3D inspector. */
:root {
  color-scheme: dark;
  --night: #0d0a07; --stone: #3a3129; --stone-hi: #5a4c3d; --sand: #b48a55; --ink: #f2e6cf; --muted: #b5a68c;
  --gold: #e0ad48; --gold-hi: #ffd884; --gold-dim: #8a6a2c; --torch: #ff9a3c; --moss: #56653a; --danger: #e0644f;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 600px; margin: 0 auto; }
.bar { display: flex; align-items: center; gap: 8px; }
.seals { display: flex; gap: 4px; flex: 1; min-width: 0; align-items: center; }
.seals svg { width: 26px; height: 26px; }
.seals .lbl { font-family: var(--display); font-size: .82rem; color: var(--muted); margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chrono { font-family: var(--mono); font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; padding: 4px 9px; border: 1px solid var(--gold-dim); border-radius: 8px; background: rgb(0 0 0 / .4); }
.chrono.flash { animation: flash .5s; } @keyframes flash { 30% { background: #5a1d14; } }
.ghost { border: 1px solid var(--gold-dim); background: rgb(0 0 0 / .3); border-radius: 8px; padding: 6px 9px; font-weight: 600; font-size: .85rem; color: var(--gold); }
.ghost[aria-pressed="false"] { color: var(--muted); border-color: #4a3f33; }
.place { font-family: var(--display); font-size: .95rem; margin: 0; color: var(--gold-hi); letter-spacing: .04em; min-height: 1.3em; }
.place small { font-family: var(--body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }

.scene-wrap { flex: 1; min-height: 0; position: relative; perspective: 1000px; touch-action: none; overflow: hidden; border-radius: 14px; border: 1px solid #2a221a; background: #120e0a; }
.scene { width: 100%; height: 100%; display: block; }
.scene.turn { animation: turn .8s cubic-bezier(.2,.8,.3,1); }
@keyframes turn { from { transform: translateZ(-300px) rotateY(var(--from, -60deg)); opacity: 0; } }
.hs { cursor: pointer; } .hs .hit { fill: transparent; } .hs:focus { outline: none; } .hs:focus-visible .hit { stroke: var(--gold); stroke-width: 3; }
.hs:active { filter: brightness(1.4); }
.flame { animation: flick .18s infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flick { to { transform: scale(.9, 1.08) skewX(3deg); opacity: .85; } }
.glow { animation: glow 2.4s ease-in-out infinite; } @keyframes glow { 50% { opacity: .55; } }
.ray { animation: ray 6s ease-in-out infinite; } @keyframes ray { 50% { opacity: .35; } }
.dust { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dust i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #ffe2a8; opacity: 0; animation: dust linear infinite; }
@keyframes dust { 10% { opacity: .55; } 90% { opacity: .4; } to { transform: translate(var(--dx), -140px); opacity: 0; } }
.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.back3d { position: absolute; z-index: 2; top: 10px; left: 10px; background: rgb(0 0 0 / .55); }
.hud3d { position: absolute; z-index: 2; left: 8px; right: 8px; bottom: 34px; display: grid; gap: 6px; justify-items: center; text-align: center; pointer-events: none; }
.hud3d[hidden], .back3d[hidden] { display: none; }
.hud3d p { margin: 0; font-size: .8rem; text-shadow: 0 1px 3px #000; background: rgb(0 0 0 / .5); padding: 4px 10px; border-radius: 8px; text-wrap: balance; }
.hud3d div { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
.hud3d .ghost { background: rgb(0 0 0 / .65); padding: 9px 12px; }
.scales { background: radial-gradient(circle at 50% 0, #4f8a5a 9px, #2a4a32 10px, transparent 11px) 0 0 / 20px 14px, #24442c; border: 2px solid #142818; }
.obsid { background: linear-gradient(135deg, #1a1d22, #3a4048 40%, #121418); border: 1px solid #000; }
.lapis { background: radial-gradient(circle at 30% 25%, #3c5aa0, #1d2c5c 60%, #101838); border: 2px solid #0a1230; }
.eyebtn { position: absolute; inset: 12%; border: 0; background: none; padding: 0; }
.clasp { position: absolute; inset: 26%; padding: 10%; border-radius: 50%; border: 3px solid #9fd38a; background: rgb(0 0 0 / .3); }
.dialrings { position: absolute; inset: 4%; } .dring { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,1.3,.5,1); } .dring svg { width: 100%; height: 100%; }
.dcore { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6e5a88, #2e2440); border: 3px solid #8a6a2c; transition: .4s; }
.dcore.lit { background: radial-gradient(circle at 35% 30%, #fff0b8, #e0ad48); box-shadow: 0 0 24px #ffd884; }
.drag-tip { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: .78rem; color: var(--muted); pointer-events: none; transition: opacity .8s; text-shadow: 0 1px 2px #000; }

.foot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tool { padding: 11px 6px; border-radius: 10px; border: 1px solid var(--gold-dim); background: rgb(0 0 0 / .35); font-weight: 600; font-size: .86rem; position: relative; }
.tool:disabled { opacity: .35; cursor: default; }
.tool .badge { position: absolute; top: -6px; right: -4px; background: var(--gold); color: #1d1408; border-radius: 999px; font-size: .7rem; padding: 1px 6px; font-weight: 700; }

/* inspector */
.inspect { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 45%, rgb(80 58 30 / .55), rgb(8 6 4 / .96) 70%); opacity: 0; pointer-events: none; transition: opacity .35s;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.inspect.open { opacity: 1; pointer-events: auto; }
.inspect h2 { font-family: var(--display); font-weight: 500; text-align: center; margin: 4px 0 0; font-size: 1.15rem; color: var(--gold-hi); letter-spacing: .05em; }
.inspect .sub { text-align: center; color: var(--muted); font-size: .82rem; margin: 2px 0 0; }
.stage { flex: 1; min-height: 0; position: relative; perspective: 900px; touch-action: none; cursor: grab; display: grid; place-items: center; }
.stage::after { content: ""; position: absolute; left: 50%; bottom: 10%; width: 56%; height: 24px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(rgb(0 0 0 / .6), transparent 70%); pointer-events: none; }
.obj { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
.inspect.open .obj.enter { animation: enter .7s cubic-bezier(.2,.9,.3,1.1); }
@keyframes enter { from { opacity: 0; transform: translate3d(var(--fx, 0), var(--fy, 160px), -900px) rotateX(-30deg) rotateY(120deg); } }
.obj.leave { transition: opacity .6s .4s, scale .9s .3s; opacity: 0; scale: .35; }
.face { position: absolute; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; transition: transform .9s cubic-bezier(.5,0,.3,1), opacity .9s; }
.face.two { backface-visibility: visible; -webkit-backface-visibility: visible; }
.shade { position: absolute; inset: 0; background: #000; pointer-events: none; }
.grp { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
.msg { min-height: 2.7em; margin: 0; text-align: center; font-size: .92rem; line-height: 1.35; text-wrap: balance; }
.ins-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--gold-dim); background: rgb(0 0 0 / .35); font-weight: 700; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1d1408; }

/* materials */
.stone { background: repeating-linear-gradient(17deg, rgb(255 255 255 / .025) 0 2px, transparent 2px 9px), radial-gradient(circle at 30% 25%, #6e5d49, #463a2e 60%, #2e261e); border: 2px solid #231c15; }
.goldm { background: linear-gradient(135deg, #8a6020, #f2c766 35%, #fff0b8 48%, #d9a441 62%, #7a5418); border: 1px solid #5c3f12; }
.goldm.flat { background: radial-gradient(circle at 35% 30%, #fff0b8, #e0ad48 45%, #8a6020); }
.cage { background: transparent; border: 9px solid #4a3d30; box-shadow: inset 0 0 0 2px #2a2119, 0 0 0 2px #2a2119; border-radius: 3px; }
.cage .eye { position: absolute; top: -8px; left: 50%; width: 30px; height: 9px; transform: translateX(-50%); }
.glyphface { display: grid; place-items: center; }
.glyphface svg { width: 70%; height: 70%; }
.glyphface.lit svg { filter: drop-shadow(0 0 6px #ffd884); }
.tri { clip-path: polygon(50% 0, 100% 100%, 0 100%); display: grid; place-items: end center; }
.tri svg { width: 52%; margin-bottom: 14%; }
.tri.lit { background: linear-gradient(160deg, #fff4c8, #ffcc55 50%, #c98a2a); }
.plane { position: absolute; transform-style: flat; pointer-events: none; }
.plane svg { width: 100%; height: 100%; overflow: visible; }
.plane.on svg { filter: drop-shadow(0 0 5px #ffd884); }
.inscr { font-family: var(--display); color: #3b2706; text-align: center; padding: 14%; font-size: var(--fs); line-height: 1.3; text-shadow: 0 1px 0 rgb(255 255 255 / .35); }
.inscr.lightt { color: #e9d4a6; text-shadow: 0 1px 0 #000; }

/* sheets */
.backdrop { position: fixed; inset: 0; z-index: 11; background: rgb(0 0 0 / .6); opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.9,.3,1.05); pointer-events: none;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet.open { transform: none; pointer-events: auto; }
.card { width: 100%; max-width: 560px; max-height: 82vh; overflow-y: auto; box-sizing: border-box; background: #1d1711; border: 1px solid var(--gold-dim); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.card h3 { font-family: var(--display); font-weight: 500; margin: 0; font-size: 1.25rem; color: var(--gold-hi); }
.card p { margin: 0; line-height: 1.5; }
.card .close { justify-self: end; margin-top: -6px; background: none; border: 0; color: var(--muted); font-size: .9rem; padding: 4px; }
.journal { background: #e9dcbc; color: #3a2a18; padding: 14px 16px; border-radius: 3px; font-family: Georgia, "Times New Roman", serif; font-style: italic; line-height: 1.55; box-shadow: 0 3px 0 rgb(0 0 0 / .35); }
.journal .date { display: block; font-style: normal; font-family: var(--display); font-size: .78rem; color: #7a5a30; margin-bottom: 4px; letter-spacing: .05em; }
.small { font-size: .82rem; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; } .row .btn { flex: 1 1 auto; }
.pad { display: grid; gap: 10px; }
.slots { display: flex; justify-content: center; gap: 8px; }
.slot { width: 48px; height: 58px; border-radius: 8px; border: 2px solid var(--gold-dim); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 1.6rem; background: #0e0b08; color: var(--gold); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys button { padding: 13px 0; border-radius: 10px; border: 1px solid var(--gold-dim); background: #221a13; font-family: var(--mono); font-size: 1.2rem; font-weight: 700; }
.keys .ok { background: var(--gold); color: #1b130b; }
.bad { animation: shake .4s; } @keyframes shake { 20%,60% { translate: -7px 0; } 40%,80% { translate: 7px 0; } }
.text-in { width: 100%; box-sizing: border-box; padding: 12px; font: 600 1.1rem var(--body); background: #0e0b08; color: var(--ink); border: 2px solid var(--gold-dim); border-radius: 10px; }
.board { display: grid; gap: 4px; }
.board .r { display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: rgb(255 255 255 / .03); font-variant-numeric: tabular-nums; }
.board .r.me { background: rgb(224 173 72 / .16); outline: 1px solid var(--gold-dim); }
.board .pos { font-family: var(--display); color: var(--gold); text-align: center; }
.board .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.board .sl { color: var(--gold-hi); font-size: .85rem; white-space: nowrap; }
.board .tm { font-family: var(--mono); font-size: .9rem; }
.doorart svg { width: 100%; height: auto; display: block; }
.toast { position: fixed; z-index: 13; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); opacity: 0; transition: .3s; background: var(--gold); color: #1b130b;
  padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.screen { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; overflow-y: auto; background: radial-gradient(ellipse at 50% 30%, #2a1f12, #0b0806 70%);
  padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
.screen[hidden] { display: none; }
.screen-inner { max-width: 440px; display: grid; gap: 16px; text-align: center; }
.screen h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 8vw, 2.5rem); margin: 0; color: var(--gold); line-height: 1.1; text-wrap: balance; letter-spacing: .03em; text-shadow: 0 2px 0 #5c3f12; }
.screen p { margin: 0; color: var(--muted); line-height: 1.55; }
.big { font-family: var(--mono); font-size: 2.3rem; font-variant-numeric: tabular-nums; }
@media (max-height: 520px) { .place { display: none; } .msg { min-height: 1.4em; } }
@media (prefers-reduced-motion: reduce) { *, .face, .grp { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <div class="bar">
    <div class="seals" id="seals"></div>
    <div class="chrono" id="chrono" role="timer">00:00</div>
    <button class="ghost" id="hint">Indice</button>
    <button class="ghost" id="snd" aria-pressed="true" aria-label="Son">Son</button>
  </div>
  <p class="place" id="place"></p>
  <div class="scene-wrap" id="scene-wrap"><div class="dust" id="dust"></div><div class="drag-tip" id="drag-tip">Glisse pour regarder autour · touche un objet ou une porte pour t'approcher</div></div>
  <div class="foot">
    <button class="tool" id="t-book">Carnet</button>
    <button class="tool" id="t-back">Grande salle</button>
    <button class="tool" id="t-rank">Classement</button>
  </div>
</div>

<div class="inspect" id="inspect" aria-modal="true" role="dialog">
  <h2 id="ins-name"></h2><p class="sub">Glisse pour tourner · touche pour manipuler</p>

  <p class="msg" id="msg"></p>
  <div class="ins-bar"><button class="btn" id="putback">Reposer</button><button class="btn primary" id="ins-act" hidden></button></div>

</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const HINT_COST = 30;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ===================== GLYPHS =====================
const G = {
  sun: '<circle cx="50" cy="50" r="16" fill="currentColor"/>' + [...Array(8)].map((_, i) => { const a = i * Math.PI / 4; return `<line x1="${50 + Math.cos(a) * 24}" y1="${50 + Math.sin(a) * 24}" x2="${50 + Math.cos(a) * 38}" y2="${50 + Math.sin(a) * 38}" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>`; }).join(""),
  moon: '<path d="M62 14 A38 38 0 1 0 62 86 A30 30 0 1 1 62 14Z" fill="currentColor"/>',
  bird: '<path d="M10 52 Q30 30 50 50 Q70 30 90 52 Q70 42 50 62 Q30 42 10 52Z" fill="currentColor"/><circle cx="50" cy="48" r="5" fill="currentColor"/>',
  wave: '<path d="M8 40 q11 -14 21 0 t21 0 t21 0 t21 0 M8 64 q11 -14 21 0 t21 0 t21 0 t21 0" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>',
  eye: '<path d="M8 50 Q50 10 92 50 Q50 90 8 50Z" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="50" cy="50" r="13" fill="currentColor"/>',
  snake: '<path d="M18 80 C18 56 50 64 50 46 C50 30 24 34 30 20 C36 10 64 12 74 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><circle cx="76" cy="26" r="7" fill="currentColor"/>',
  star: '<path d="M50 8 L61 38 L93 39 L67 58 L77 90 L50 71 L23 90 L33 58 L7 39 L39 38Z" fill="currentColor"/>',
  hand: '<path d="M30 92 V44 a6 6 0 0 1 12 0 V20 a6 6 0 0 1 12 0 V40 V16 a6 6 0 0 1 12 0 V44 a6 6 0 0 1 12 0 V70 Q78 92 56 92Z" fill="currentColor"/>',
  spiral: '<path d="M50 50 m0 -4 a4 4 0 1 1 -4 4 a10 10 0 1 1 10 10 a16 16 0 1 1 -16 -16 a24 24 0 1 1 24 24" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>',
};
const glyph = (k, color = "currentColor") => `<svg viewBox="0 0 100 100" style="color:${color}">${G[k]}</svg>`;
const glyphG = (k, x, y, s, color) => `<g transform="translate(${x - s / 2} ${y - s / 2}) scale(${s / 100})" style="color:${color}">${G[k]}</g>`;
const SEALS = [{ k: "sun", name: "Soleil" }, { k: "snake", name: "Serpent" }, { k: "eye", name: "Œil" }, { k: "spiral", name: "Spirale" }];

// ===================== PUZZLE DATA =====================
// — Sun —
const RINGS = [
  ["sun", "moon", "bird", "wave", "eye", "snake", "star", "hand"],
  ["eye", "wave", "hand", "sun", "snake", "bird", "moon", "star"],
  ["star", "snake", "moon", "hand", "sun", "eye", "wave", "bird"],
];
const LINTEL = ["sun", "wave", "bird"];                   // carved left → right
const RING_TARGET = [...LINTEL].reverse();                // builders wrote right → left
const RELIC_SEEN = "418", RELIC_CODE = [...RELIC_SEEN].reverse().join(""); // read in the cage, typed the builders' way (right → left)
const ANA = { ax: -18, ay: 135 };                         // the one view where the digits line up
const PYR_RAYS = [3, 1, 4, 2];                            // rays engraved on each face of the pyramid
// — Serpent —
const TOTEM = [ // per block, 4 faces; a = entry x at the top edge, b = exit x at the bottom edge
  [{ t: "blank" }, { t: "head", b: 20 }, { t: "head", b: 80 }, { t: "blank" }],
  [{ t: "mid", a: 20, b: 50 }, { t: "blank" }, { t: "mid", a: 50, b: 80 }, { t: "mid", a: 80, b: 20 }],
  [{ t: "tail", a: 80 }, { t: "tail", a: 20 }, { t: "blank" }, { t: "blank" }],
];
const TOTEM_SOL = [2, 3, 1];                              // the only continuous body: head→80, 80→20, 20→tail
const SHADOW_CODE = "736", SCULPT_STEPS = 24;             // sculpture turns in 15° steps; its shadow reads only at step 0
const SNAKE_RELIEFS = 9, CHEST_CODE = String(+SHADOW_CODE - SNAKE_RELIEFS); // shadow minus the serpents carved around the room
// — Œil —
const EYE_DOOR = { zMin: -6.6, zMax: -4.4 };
const MIRRORS = [{ x: 4, z: -9.5 }, { x: 2, z: -9.5 }];   // gaze: statue → mirror 1 → mirror 2 → door (statue 6, mirrors 6 & 1)
const ROCK = { x: 5.4, z: -4.6, r: .7 };
const PUPIL_TARGET = { front: 1, back: 3, top: 1, bottom: 1 }; // 0 up, 1 right, 2 down, 3 left (face-local): all toward the sun face (+x)
// — Spirale —

const DIAL = {
  title: () => "Le disque de la Spirale", ax: -10, ay: -18,
  bar: () => [["Extérieur", () => turnDial(0)], ["Milieu", () => turnDial(1)], ["Centre", () => turnDial(2)]],
  build() {

    const front = face("stone", s, s, `translateZ(${t / 2}px)`, [0, 0, 1], `<div class="dialrings">${[[78, 96], [56, 74], [34, 52]].map(([a, b], k) => `<div class="dring" data-ring="${k}" style="transform:rotate(${S.dial[k] * 45}deg)">${ringSVG(a, b, DIAL_GAPS[k])}</div>`).join("")}<div class="dcore"></div></div>`);
    front.el.style.borderRadius = "50%";

  torch(trR, -4.95, 2.6, -1, Math.PI / 2); torch(trR, 4.95, 2.6, -1, -Math.PI / 2);
  beam(trR, 0, 4.2, -2.5, 6, .5, 1.1, .2); dust(trR, 250, 8, 6, 9, -1, 0xffd890);

  const GROUPS = { hall, sun: sunR, snake: snakeR, eye: eyeR, spiral: spR, treasure: trR };

  // ================= CAMERA, VIEWPOINTS =================
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const VP = {
    hall: { home: [V(0, 1.7, 8.6), V(0, 3.6, -11)], door: [V(0, 2.4, -5.2), V(0, 4.3, -11)],
      drum: [V(-2.2, 2.1, 5.0), V(-4, 1.45, 3.9)], totem: [V(-2.2, 2.1, -2.4), V(-4, 1.45, -3.8)], dial: [V(2.2, 2.1, 5.0), V(4, 1.45, 3.9)], bust: [V(-2.5, 7, 2), V(3.5, .5, -6)],
      sundoor: [V(-3.2, 1.8, 2.2), V(-7, 2.3, 2.2)], lintel: [V(-3.6, 2.4, 2.2), V(-7, 5.2, 2.2)], snakedoor: [V(-3.2, 1.8, -5.5), V(-7, 2.3, -5.5)], eyedoor: [V(3, 1.8, -6.4), V(7, 2.3, -5.5)], spiraldoor: [V(3.2, 1.8, 2.2), V(7, 2.3, 2.2)],
      sun_in: [V(-6.4, 1.8, 2.2), V(-9, 1.8, 2.2)], snake_in: [V(-6.4, 1.8, -5.5), V(-9, 1.8, -5.5)], eye_in: [V(6.4, 1.8, -5.5), V(9, 1.8, -5.5)], spiral_in: [V(6.4, 1.8, 2.2), V(9, 1.8, 2.2)],
      great: [V(0, 2.6, -8.6), V(0, 3.2, -12)] },
    sun: { home: [V(0, 1.75, 4.6), V(0, 1.6, -3)], relic: [V(0, 2.05, -.6), V(0, 1.25, -2.5)], page_sun: [V(1.1, 1.5, 2.1), V(1.7, 0, .4)] },
    snake: { home: [V(0, 1.75, 5), V(0, 1.7, -6)], sculpt: [V(1.6, 1.9, 1.4), V(-1.5, 1.8, -6)], chest: [V(1.9, 2.1, -.8), V(1.9, 1.2, -3.2)], page_snake: [V(-2.2, 1.5, 4.9), V(-2.8, 0, 3.4)] },

    spiral: { home: [V(0, 1.75, 6.2), V(0, 1.7, -7)], medallion: [EYEPT.clone(), V(0, 1.65 + Math.tan(.07) * 5, -2)], spcyl: [V(2.2, 2.05, -2.4), V(3, 1.25, -4.6)], page_spiral: [V(-2.4, 1.5, 3.7), V(-3, 0, 2)] },
    treasure: { home: [V(0, 1.75, 4.5), V(0, 1.4, -2.5)], heart: [V(0, 1.9, -.3), V(0, 1.5, -2.5)] },
  };
  let at = "home", base = { p: V(0, 1.7, 8.6), t: V(0, 3.6, -11) }, yaw = 0, pitch = 0, flying = null, shown = null;
  const offOf = sc => GROUPS[sc].position;
  const lookFrom = (p, t) => { const d = t.clone().sub(p).normalize(); return { yaw: Math.atan2(d.x, -d.z), pitch: Math.asin(d.y) }; };

    yaw = 0; pitch = 0; at = id; backBtn.hidden = id === "home" || S.scene === "treasure"; hud(null); sfx("whoosh");

      base.p.lerpVectors(p0, p1, e); base.t.lerpVectors(t0, t1, e); if (k >= 1) { flying = null; res(); } }; });
  }
  function home(sc) { const v = VP[sc].home, off = offOf(sc); base.p = v[0].clone().add(off); base.t = v[1].clone().add(off); yaw = pitch = 0; at = "home"; backBtn.hidden = true; hud(null); }
  const backBtn = document.createElement("button"); backBtn.className = "ghost back3d"; backBtn.textContent = "← Reculer"; backBtn.hidden = true; wrap.appendChild(backBtn);
  backBtn.onclick = e => { e.stopPropagation(); fly("home"); };
  const hudEl = document.createElement("div"); hudEl.className = "hud3d"; hudEl.hidden = true; wrap.appendChild(hudEl);
  function hud(kind) {
    if (!kind) { hudEl.hidden = true; return; }

  }

  // ---------- puzzles living in the 3D scene ----------
  const CIRCLES = [{ x: ROCK.x, z: ROCK.z, r: ROCK.r }, ...[-8.5, -1.6, 5.4].flatMap(z => [{ x: -4.9, z, r: .62 }, { x: 4.9, z, r: .62 }]), { x: -4, z: 3.9, r: .6 }, { x: -4, z: -3.8, r: .6 }, { x: 4, z: 3.9, r: .6 }];
  function traceGaze() {

        const rx = m.x - x, rz = m.z - z, t = (-rx * tz + tx * rz) / det, s = (dx * rz - dz * rx) / det; if (t > 1e-3 && Math.abs(s) <= .47 && t < best) { best = t; kind = "mirror"; mi = i; } });

  function drawGaze() {

  }
  function turnGaze(which) {
    if (S.eyeOpen) return toast("La porte de l'Œil est déjà ouverte.");

  }
  function turnSculpt(d) {

    if (S.sculpt === 0 && !S.shadowSeen) { S.shadowSeen = true; save(); setTimeout(() => { sfx("chime"); toast("L'ombre sur le mur devient lisible !"); }, 450); }
  }

  // ---------- input: drag to look, tap to go ----------
  const ray = new T.Raycaster(), ndc = new T.Vector2(); let pd = null;
  canvas.addEventListener("pointerdown", e => { pd = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() }; });
  addEventListener("pointermove", e => { if (!pd || flying) return; const dx = e.clientX - pd.x, dy = e.clientY - pd.y; pd.x = e.clientX; pd.y = e.clientY;
    if (Math.hypot(e.clientX - pd.sx, e.clientY - pd.sy) < 8) return; $("drag-tip").style.opacity = 0;
    yaw = Math.max(-1.6, Math.min(1.6, yaw - dx * .005)); pitch = Math.max(-.6, Math.min(.6, pitch + dy * .004)); });
  addEventListener("pointerup", e => { if (!pd) return; const tap = Math.hypot(e.clientX - pd.sx, e.clientY - pd.sy) < 8 && performance.now() - pd.t < 600; pd = null;
    if (!tap || flying || !S.started || (S.ended && S.scene !== "treasure")) return;
    const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    const seen = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
    const hit = ray.intersectObject(GROUPS[S.scene], true).find(h => !h.object.isPoints && !h.object.isSprite && !(h.object.material && h.object.material.blending === T.AdditiveBlending) && seen(h.object));

  async function go(id, e) {
    if (id.startsWith("page_") && S.journal.includes({ page_sun: "j2", page_snake: "j4", page_eye: "j5", page_spiral: "j6" }[id])) return;
    if (DOOR_OF[id]) { const k = DOOR_OF[id]; S.focus = k; if (isOpen(k)) { await fly(id, 900); await fly(k + "_in", 700); return goScene(k); } await fly(id); return act(id, e); }
    if (id === "bust" || id.startsWith("mirror")) { S.focus = "eye"; if (at !== "bust") { await fly("bust"); return hud("bust"); } return turnGaze(id === "bust" ? "bust" : +id.slice(-1)); }
    if (id === "sculpt") { S.focus = "snake"; if (at !== "sculpt") { await fly("sculpt"); return hud("sculpt"); } return turnSculpt(1); }
    if (id === "medallion") { S.focus = "spiral"; await fly("medallion", 1400); if (!S.spSeen) { S.spSeen = true; save(); sfx("chime"); toast("Les fragments se recollent devant toi…"); } return; }

  }

  // ---------- great door ----------
  let greatAnim = null;
  async function openGreat() {
    if (S.scene !== "hall") return;
    await fly("door", 900); sfx("rumble"); setTimeout(() => sfx("rumble"), 1200); buzz([80, 60, 120, 60, 200]);
    S.greatOpen = true; save(); beyond.visible = true; greatAnim = performance.now();
    setTimeout(async () => { await fly("great", 1800); canvas.style.transition = "opacity .9s"; canvas.style.opacity = 0; setTimeout(() => { goScene("treasure"); toast("Touche le Cœur d'Ambre"); }, 950); }, 3200);
  }

  // ---------- sync game state → scene ----------

      if (!first) { canvas.style.transition = "none"; canvas.style.opacity = 0; requestAnimationFrame(() => requestAnimationFrame(() => { canvas.style.transition = "opacity .7s"; canvas.style.opacity = 1; })); } }
    Object.entries(DOORS).forEach(([k, d]) => { const o = isOpen(k); d.glow.visible = o; d.hole.visible = !o; d.plaque.material.emissiveIntensity = o ? .8 : .35; if (d.opened === null || !o) d.slab.position.y = o ? -2.1 : 2; d.opened = o; });
    meds.forEach(m => { m.on = S.sealed.includes(m.k); m.mat.emissiveIntensity = m.on ? 1.2 : 0; });
    if (!S.greatOpen) { leaves[0].rotation.y = 0; leaves[1].rotation.y = 0; beyond.visible = false; } else if (!greatAnim) { leaves[0].rotation.y = -1.5; leaves[1].rotation.y = 1.5; beyond.visible = true; }
    drumRings.forEach((c, r) => c.rotation.y = Math.PI / 2 - S.drum[r] * Math.PI / 4);
    totemBlocks.forEach((b, k) => b.rotation.y = S.totem[k] * Math.PI / 2);
    drawGaze();
    cage.visible = S.relic === 0; pyr.visible = S.relic === 1; sunKey.visible = S.relic === 2; relic.visible = S.relic < 3;
    chestM.visible = S.chest < 2; snakeKey.visible = S.chest === 2;
    eyeCubeM.visible = S.eyeStage === 0; eyeKey.visible = S.eyeStage === 1;
    cylM.visible = S.spStage === 0; spKey.visible = S.spStage === 1;
    Object.entries({ page_sun: "j2", page_snake: "j4", page_eye: "j5", page_spiral: "j6" }).forEach(([id, j]) => { const p = pages[id]; p.visible = p.userData.glow.visible = !S.journal.includes(j); });
  }
  function reset() { shown = null; greatAnim = null; canvas.style.opacity = 1; }

  // ---------- loop ----------

  const clock = new T.Clock();
